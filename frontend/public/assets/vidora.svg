<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Energetic Crimson to Deep Ruby -->
    <linearGradient id="vidoraBg" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#FF264C" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#990014" />
    </linearGradient>

    <!-- Top Gloss Sheen -->
    <linearGradient id="vidoraGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Play Button Fill Gradient -->
    <linearGradient id="playWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2F2F2" />
    </linearGradient>

    <!-- Chevron Gradient -->
    <linearGradient id="chevronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#A30013" />
    </linearGradient>

    <!-- Outer Soft Drop Shadow -->
    <filter id="vidoraShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FF0033" flood-opacity="0.35" />
    </filter>

    <!-- Symbol Drop Shadow -->
    <filter id="symbolShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4A000A" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base (App Badge) -->
  <rect x="52" y="52" width="408" height="408" rx="104" ry="104" fill="url(#vidoraBg)" filter="url(#vidoraShadow)" />

  <!-- Inner Stroke Highlight -->
  <rect x="53.5" y="53.5" width="405" height="405" rx="102.5" ry="102.5" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2.5" />

  <!-- Top Gloss Highlight Curve -->
  <path d="M 52 154 C 52 98, 98 52, 154 52 L 358 52 C 414 52, 460 98, 460 154 C 360 195, 152 195, 52 154 Z" fill="url(#vidoraGloss)" />

  <!-- Central Play Button with 'V' for Vidora -->
  <g filter="url(#symbolShadow)">
    <!-- White Play Triangle with smooth corners -->
    <path d="M 180 150 C 166 141, 152 150, 152 168 L 152 344 C 152 362, 166 371, 180 362 L 344 274 C 358 266, 358 246, 344 238 Z" fill="url(#playWhite)" />

    <!-- Stylized 'V' Chevron cut in the Play button (representing Vidora & fast-forward / play) -->
    <path d="M 198 188 L 265 256 L 198 324 L 230 324 L 297 256 L 230 188 Z" fill="url(#chevronGrad)" />
  </g>
</svg>
